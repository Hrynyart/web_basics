<!DOCTYPE html>
<html lang="uk">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Моя перша HTML-форма</title>
  </head>
  <body>
    
<h1>Моя перша HTML-форма</h1>

<form action="https://httpbin.org/post" method="POST">

    <p>
        <label for="username">Ім'я:</label>
        <input type="text" id="username" name="user_name">
    </p>

    <p>
        <label>
            Дата народження:
            <input type="date" name="user_birthdate">
        </label>
    </p>

    <p>
        <label for="email">Імейл:</label>
        <input type="email" id="email" name="user_email">
    </p>

    <p>
        <label for="message">Повідомлення:</label>
        <textarea id="message" name="user_message"></textarea>
    </p>

<fieldset>
    <legend>Ваші улюблені напої?</legend>

    <label>
        <input type="checkbox" name="drinks" value="coffee">
        Кава
    </label>

    <label>
        <input type="checkbox" name="drinks" value="tea">
        Чай
    </label>

    <label>
        <input type="checkbox" name="drinks" value="juice">
        Сік
    </label>

    <label>
        <input type="checkbox" name="drinks" value="water">
        Вода
    </label>
</fieldset>

<br>

<fieldset>
    <legend>Моя національність</legend>

    <label>
        <input type="radio" name="nationality" value="ukrainian">
        Українець
    </label>

    <label>
        <input type="radio" name="nationality" value="czech">
        Чех
    </label>

    <label>
        <input type="radio" name="nationality" value="polish">
        Поляк
    </label>
</fieldset>

<br>

    <button type="submit">Надіслати</button>
    <button type="reset">Очистити</button>

</form>

<h2>Адаптивне зображення</h2>

<picture>
    <source
        media="(max-width: 467px)"
        srcset="https://picsum.photos/300/500">

    <img
        src="https://picsum.photos/1000/400"
        alt="Випадкове зображення"
        style="max-width: 100%; height: auto;">
</picture>


    <script src="./script.js"></script>
  </body>
</html>
